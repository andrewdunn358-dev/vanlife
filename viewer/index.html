<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vanlife — 4G signal layer</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 1;
    background: #fff; padding: 12px; border-radius: 6px;
    box-shadow: 0 1px 5px rgba(0,0,0,.3); font-size: 13px; width: 220px;
  }
  #panel h1 { font-size: 14px; margin: 0 0 8px; }
  #search { display: flex; gap: 4px; margin-bottom: 10px; }
  #q {
    flex: 1; min-width: 0; padding: 5px 6px; font-size: 12px;
    border: 1px solid #bbb; border-radius: 4px;
  }
  #go {
    padding: 5px 9px; font-size: 12px; cursor: pointer;
    border: 1px solid #2b2b2b; background: #2b2b2b; color: #fff;
    border-radius: 4px;
  }
  #results {
    list-style: none; margin: 0 0 10px; padding: 0;
    max-height: 150px; overflow-y: auto; font-size: 12px;
  }
  #results li {
    padding: 5px 6px; cursor: pointer; border-radius: 3px;
    border-bottom: 1px solid #eee;
  }
  #results li:hover { background: #f0f0f0; }
  .ops { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  .ops button {
    flex: 1 1 45%; padding: 5px 4px; font-size: 12px; cursor: pointer;
    border: 1px solid #bbb; background: #f4f4f4; border-radius: 4px;
  }
  .ops button.on { background: #2b2b2b; color: #fff; border-color: #2b2b2b; }
  .key { font-size: 12px; color: #444; line-height: 1.6; }
  .sw { display: inline-block; width: 11px; height: 11px;
        border-radius: 2px; vertical-align: -1px; margin-right: 5px; }
  #status { font-size: 12px; color: #666; margin: 8px 0 0; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>Ofcom 4G drive-test</h1>
  <div id="search">
    <input id="q" placeholder="Postcode or place" autocomplete="off">
    <button id="go">Go</button>
  </div>
  <ul id="results"></ul>
  <div class="ops">
    <button data-f="best" class="on">Best of all</button>
    <button data-f="ee">EE</button>
    <button data-f="o2">O2</button>
    <button data-f="vodafone">Vodafone</button>
    <button data-f="three">Three</button>
    <button data-f="n_ops">Operator count</button>
  </div>
  <div class="key" id="key"></div>
  <p id="status">Loading…</p>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
<script>
const PMTILES_URL = "signal-4g.pmtiles";

const RSRP_RAMP = [
  -125, "#8c0303",
  -110, "#d73027",
  -100, "#fc8d59",
   -90, "#fee08b",
   -80, "#1a9850"
];

const COUNT_RAMP = [0, "#8c0303", 1, "#d73027", 2, "#fc8d59", 3, "#fee08b", 4, "#1a9850"];

const KEYS = {
  rsrp: '<span class="sw" style="background:#8c0303"></span>no signal / notspot<br>' +
        '<span class="sw" style="background:#d73027"></span>very weak (&minus;110)<br>' +
        '<span class="sw" style="background:#fc8d59"></span>weak (&minus;100)<br>' +
        '<span class="sw" style="background:#fee08b"></span>usable (&minus;90)<br>' +
        '<span class="sw" style="background:#1a9850"></span>strong (&minus;80+)',
  count: '<span class="sw" style="background:#8c0303"></span>none &mdash; total notspot<br>' +
         '<span class="sw" style="background:#d73027"></span>one operator<br>' +
         '<span class="sw" style="background:#fc8d59"></span>two<br>' +
         '<span class="sw" style="background:#fee08b"></span>three<br>' +
         '<span class="sw" style="background:#1a9850"></span>all four'
};

const protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);

const map = new maplibregl.Map({
  container: "map",
  center: [-3.5, 54.5],
  zoom: 5,
  style: {
    version: 8,
    sources: {
      osm: {
        type: "raster",
        tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
        tileSize: 256,
        attribution: "© OpenStreetMap contributors | Signal data © Ofcom"
      }
    },
    layers: [{ id: "osm", type: "raster", source: "osm" }]
  }
});

function paintFor(field) {
  if (field === "n_ops") {
    return ["interpolate", ["linear"], ["coalesce", ["get", "n_ops"], 0]].concat(COUNT_RAMP);
  }
  // A missing value for an operator means no reading there. Show it as
  // dead rather than hiding it - that absence is the useful signal.
  return ["interpolate", ["linear"], ["coalesce", ["get", field], -125]].concat(RSRP_RAMP);
}

function setField(field) {
  map.setPaintProperty("signal", "circle-color", paintFor(field));
  document.getElementById("key").innerHTML =
    field === "n_ops" ? KEYS.count : KEYS.rsrp;
  document.querySelectorAll(".ops button").forEach(function (b) {
    b.classList.toggle("on", b.dataset.f === field);
  });
}

map.on("load", function () {
  map.addSource("sig", { type: "vector", url: "pmtiles://" + PMTILES_URL });
  map.addLayer({
    id: "signal",
    type: "circle",
    source: "sig",
    "source-layer": "signal",
    paint: {
      "circle-radius": ["interpolate", ["linear"], ["zoom"], 5, 1.4, 9, 2.5, 12, 4.5],
      "circle-opacity": 0.8,
      "circle-color": paintFor("best")
    }
  });
  setField("best");
  document.getElementById("status").textContent =
    "Pan to rural Wales and NW Scotland - that is the real test.";
});

document.querySelectorAll(".ops button").forEach(function (b) {
  b.addEventListener("click", function () { setField(b.dataset.f); });
});

map.on("click", "signal", function (e) {
  var p = e.features[0].properties;
  var rows = Object.keys(p).map(function (k) {
    return "<tr><td style='padding-right:8px'>" + k + "</td><td><b>" + p[k] + "</b></td></tr>";
  }).join("");
  new maplibregl.Popup()
    .setLngLat(e.lngLat)
    .setHTML("<table style='font-size:12px;border-collapse:collapse'>" + rows + "</table>")
    .addTo(map);
});

map.on("error", function (e) {
  document.getElementById("status").textContent =
    "Error: " + ((e.error && e.error.message) || e.type);
});

// ---- Search -------------------------------------------------------------
// Two geocoders, because neither alone is right:
//   postcodes.io  - UK-specific, open, unlimited, exact on postcodes
//   Nominatim     - everything else, but ~1 req/sec and no partial postcodes
// Swap Nominatim for OS Places before this ever faces real users.

var POSTCODE_RE = /^[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}$/i;
var q = document.getElementById("q");
var results = document.getElementById("results");
var marker = null;

function clearResults() { results.innerHTML = ""; }

function goTo(lon, lat, label, zoom) {
  if (marker) marker.remove();
  marker = new maplibregl.Marker({ color: "#2b2b2b" })
    .setLngLat([lon, lat])
    .setPopup(new maplibregl.Popup().setText(label))
    .addTo(map);
  map.flyTo({ center: [lon, lat], zoom: zoom || 12, duration: 1200 });
  clearResults();
  document.getElementById("status").textContent = label;
}

function showOptions(items) {
  clearResults();
  if (!items.length) {
    document.getElementById("status").textContent = "Nothing found.";
    return;
  }
  items.slice(0, 6).forEach(function (it) {
    var li = document.createElement("li");
    li.textContent = it.label;
    li.addEventListener("click", function () {
      goTo(it.lon, it.lat, it.label, it.zoom);
    });
    results.appendChild(li);
  });
}

function search() {
  var term = q.value.trim();
  if (!term) return;
  document.getElementById("status").textContent = "Searching…";
  clearResults();

  if (POSTCODE_RE.test(term)) {
    fetch("https://api.postcodes.io/postcodes/" + encodeURIComponent(term))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.status !== 200 || !d.result) throw new Error("not found");
        var res = d.result;
        goTo(res.longitude, res.latitude,
             res.postcode + " — " + (res.admin_district || ""), 13);
      })
      .catch(function () {
        document.getElementById("status").textContent =
          "Postcode not found. Try a place name.";
      });
    return;
  }

  fetch("https://nominatim.openstreetmap.org/search?format=json&limit=6" +
        "&countrycodes=gb&q=" + encodeURIComponent(term))
    .then(function (r) { return r.json(); })
    .then(function (arr) {
      showOptions(arr.map(function (a) {
        return {
          lon: parseFloat(a.lon),
          lat: parseFloat(a.lat),
          label: a.display_name.split(",").slice(0, 3).join(","),
          zoom: 12
        };
      }));
    })
    .catch(function () {
      document.getElementById("status").textContent = "Search failed.";
    });
}

document.getElementById("go").addEventListener("click", search);
q.addEventListener("keydown", function (e) { if (e.key === "Enter") search(); });

// Shortcuts to the places that actually test this data.
var PROBES = [
  ["Cambrian Mtns", -3.75, 52.35],
  ["Applecross", -5.80, 57.43],
  ["Upper Teesdale", -2.16, 54.65],
  ["Rannoch Moor", -4.66, 56.62]
];
var probeBar = document.createElement("div");
probeBar.style.cssText = "margin-top:8px;font-size:11px;line-height:1.7";
probeBar.innerHTML = "<b>Test notspots:</b><br>";
PROBES.forEach(function (p, i) {
  var a = document.createElement("a");
  a.href = "#";
  a.textContent = p[0];
  a.style.cssText = "color:#0645ad;margin-right:8px";
  a.addEventListener("click", function (ev) {
    ev.preventDefault();
    goTo(p[1], p[2], p[0], 11);
  });
  probeBar.appendChild(a);
  if (i % 2 === 1) probeBar.appendChild(document.createElement("br"));
});
document.getElementById("panel").appendChild(probeBar);
</script>
</body>
</html>
