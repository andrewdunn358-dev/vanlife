<div class="vehicle">
<h4>Your van</h4>
<p>The rules depend on the vehicle, not just the place. Tell it what you drive
and every record below will say whether it applies to you. This stays in your
browser &mdash; nothing is sent anywhere.</p>
<div class="vrow">
  <label>Height (m)<input type="number" id="v-height" step="0.1" min="1" max="5"></label>
  <label>Length (m)<input type="number" id="v-length" step="0.1" min="2" max="12"></label>
  <label>V5C says
    <select id="v-body">
      <option value="motor_caravan">motor caravan</option>
      <option value="panel_van">panel van</option>
      <option value="light_goods">light goods</option>
      <option value="car">car</option>
      <option value="minibus">minibus</option>
    </select>
  </label>
  <label>Toilet
    <select id="v-toilet">
      <option value="none">none</option>
      <option value="portable">portable</option>
      <option value="fixed_cassette">fixed cassette</option>
      <option value="fixed_tank">fixed tank</option>
    </select>
  </label>
</div>
<div class="vrow vchecks">
  <label><input type="checkbox" id="v-sleeps"> adapted for sleeping</label>
  <label><input type="checkbox" id="v-grey"> sealed waste water</label>
  <label><input type="checkbox" id="v-black"> sealed sewage</label>
</div>
<p id="v-summary" class="vsum"></p>
</div>
